<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>מפת עמדות טעינה</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="style.css" />

<script>
  // Runs before the stylesheet paints: reading the saved choice here avoids a
  // light flash for users who picked dark. No stored choice means light.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("ev-theme"); } catch (e) { /* storage blocked */ }
    document.documentElement.setAttribute("data-theme", saved === "dark" ? "dark" : "light");
  })();
</script>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">
  <header id="topbar">
    <button type="button" id="theme-toggle" aria-label="מעבר למצב כהה" title="מעבר למצב כהה">
      <svg class="icon theme-icon theme-icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      <svg class="icon theme-icon theme-icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
    </button>

    <nav id="mode-tabs" role="tablist" aria-label="מצב תצוגה">
      <button type="button" class="mode-tab is-active" id="tab-map" role="tab" aria-selected="true" aria-controls="map">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg>
        <span>מפה</span>
      </button>
      <button type="button" class="mode-tab" id="tab-trip" role="tab" aria-selected="false" aria-controls="trip-panel">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 6.5h6a4 4 0 0 1 4 4v0a4 4 0 0 1-4 4H8"/></svg>
        <span>תכנון נסיעה</span>
      </button>
    </nav>
  </header>

  <header id="toolbar">
    <div id="count-line">
      <span id="count">טוען עמדות&hellip;</span>
      <button type="button" id="filters-reset" class="hidden">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        <span>אפס סינון</span>
      </button>
    </div>

    <div id="search-row">
      <svg class="icon" id="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>
      </svg>
      <input id="search" type="text" placeholder="חיפוש לפי שם או עיר&hellip;" autocomplete="off" />
    </div>

    <div id="speed-group" role="group" aria-label="סינון לפי מהירות טעינה">
      <button type="button" class="speed-btn is-active" data-speed="ALL">הכול</button>
      <button type="button" class="speed-btn" data-speed="SLOW">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 10 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a8 8 0 1 0-16 0v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3l2-4h4Z"/><path d="M4.82 7.9 8 10"/><path d="M15.18 7.9 12 10"/><path d="M16.93 10H20a2 2 0 0 1 0 4H2"/></svg>
        <span>עד 22kW</span>
      </button>
      <button type="button" class="speed-btn" data-speed="FAST">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z"/></svg>
        <span>50&ndash;150kW</span>
      </button>
      <button type="button" class="speed-btn" data-speed="ULTRA">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09"/><path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05"/></svg>
        <span>150kW+</span>
      </button>
    </div>

    <div id="select-row">
      <div id="provider-wrap">
        <button type="button" id="provider-btn" aria-haspopup="listbox" aria-expanded="false">
          <span id="provider-btn-label">כל המפעילים</span>
          <svg class="icon" id="provider-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div id="provider-dropdown" class="hidden" role="listbox" aria-label="בחר מפעיל" tabindex="-1">
          <div id="provider-search-row">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>
            </svg>
            <input id="provider-search" type="text" placeholder="חיפוש מפעיל&hellip;" autocomplete="off" />
          </div>
          <div id="provider-options"></div>
          <div id="provider-no-results" class="hidden">לא נמצאו מפעילים</div>
        </div>
      </div>
      <button id="list-toggle" type="button" aria-label="הצג רשימת עמדות">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h.01"/><path d="M3 12h.01"/><path d="M3 19h.01"/><path d="M8 5h13"/><path d="M8 12h13"/><path d="M8 19h13"/></svg>
        <span>רשימה</span>
      </button>
    </div>
  </header>

  <div id="map-stack">
    <div id="map" class="map-pane" role="tabpanel" aria-label="מפת עמדות טעינה"></div>
    <div id="trip-map" class="map-pane is-inactive"></div>

    <div id="map-pick-banner" class="hidden">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg>
      <span id="map-pick-text">לחצו על המפה לבחירת מוצא</span>
      <button type="button" id="map-pick-cancel">ביטול</button>
    </div>
  </div>

  <div id="list-panel" class="hidden">
    <div id="list-panel-handle"></div>
    <div id="list-panel-header">
      <span>עמדות קרובות</span>
      <button id="list-close" type="button" aria-label="סגור רשימה">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="list-items"></div>
  </div>

  <div id="trip-panel" class="hidden" role="tabpanel" aria-label="תכנון נסיעה">
    <div id="trip-panel-handle"></div>
    <div id="trip-panel-inner">

      <div class="trip-points">
        <div class="trip-point-row">
          <span class="trip-point-dot trip-point-dot--origin" aria-hidden="true"></span>
          <div class="trip-input-wrap">
            <input type="text" id="trip-origin-input" placeholder="מוצא: עיר, כתובת&hellip;" autocomplete="off" aria-label="נקודת מוצא" />
            <div class="trip-suggest hidden" id="trip-origin-suggest" role="listbox" aria-label="הצעות למוצא"></div>
          </div>
          <button type="button" class="trip-pick-btn" data-target="origin" aria-label="בחר מוצא על המפה">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg>
          </button>
        </div>

        <button type="button" id="trip-swap-btn" aria-label="החלף מוצא ויעד">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="M16 21l4-4-4-4"/><path d="M20 17H4"/></svg>
        </button>

        <div class="trip-point-row">
          <span class="trip-point-dot trip-point-dot--destination" aria-hidden="true"></span>
          <div class="trip-input-wrap">
            <input type="text" id="trip-dest-input" placeholder="יעד: עיר, כתובת&hellip;" autocomplete="off" aria-label="יעד" />
            <div class="trip-suggest hidden" id="trip-dest-suggest" role="listbox" aria-label="הצעות ליעד"></div>
          </div>
          <button type="button" class="trip-pick-btn" data-target="destination" aria-label="בחר יעד על המפה">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/></svg>
          </button>
        </div>
      </div>

      <div class="trip-battery-field">
        <div class="trip-battery-head">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10.5v3"/><path d="M6 10v4"/></svg>
          <label for="trip-battery-slider">אחוז סוללה נוכחי</label>
          <output id="trip-battery-value" for="trip-battery-slider">80%</output>
        </div>
        <input type="range" id="trip-battery-slider" min="1" max="100" step="1" value="80" aria-label="אחוז סוללה נוכחי" />
      </div>

      <button type="button" id="trip-settings-toggle" aria-expanded="false" aria-controls="trip-settings">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h6"/><path d="M14 6h6"/><circle cx="11" cy="6" r="2"/><path d="M4 12h10"/><path d="M18 12h2"/><circle cx="16" cy="12" r="2"/><path d="M4 18h6"/><path d="M14 18h6"/><circle cx="11" cy="18" r="2"/></svg>
        <span>הגדרות רכב</span>
        <svg class="icon" id="trip-settings-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>

      <div class="trip-settings hidden" id="trip-settings">
        <label>טווח סוללה (ק"מ)<input type="number" id="trip-range" min="50" max="1000" step="10" inputmode="numeric" /></label>
        <label>צריכה (kWh ל-100 ק"מ)<input type="number" id="trip-consumption" min="5" max="40" step="0.5" inputmode="decimal" /></label>
        <label>מרווח ביטחון (%)<input type="number" id="trip-margin" min="0" max="50" step="5" inputmode="numeric" /></label>
        <div class="trip-settings-note">הגדרות הרכב נשמרות. אחוז הסוללה נשאל בכל תכנון נסיעה בנפרד.</div>
      </div>

      <div class="trip-actions">
        <button type="button" id="trip-calc-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8 6.5h6a4 4 0 0 1 4 4v0a4 4 0 0 1-4 4H8"/></svg>
          <span>חשב מסלול</span>
        </button>
        <button type="button" id="trip-saved-btn" aria-haspopup="dialog">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1Z"/></svg>
          <span>התוכניות שלי</span>
        </button>
      </div>

      <div id="trip-status" class="hidden" role="status" aria-live="polite"></div>

      <div id="trip-summary" class="hidden">
        <div class="trip-summary-stats" id="trip-summary-stats"></div>
        <button type="button" id="trip-fit-btn">הצג את כל המסלול</button>
      </div>

      <div id="trip-stops-list"></div>
    </div>
  </div>

  <div id="saved-trips-panel" class="hidden" role="dialog" aria-label="התוכניות שלי">
    <div id="saved-trips-header">
      <span>התוכניות שלי</span>
      <button type="button" id="saved-trips-close" aria-label="סגור">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div id="saved-trips-list"></div>
    <div id="saved-trips-empty" class="hidden">עדיין אין תוכניות שמורות</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="trip-logic.js"></script>
<script src="app.js"></script>
<script src="trip-ui.js"></script>
</body>
</html>
