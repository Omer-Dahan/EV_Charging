<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>מפת עמדות טעינה</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="stylesheet" href="style.css" />

<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<div id="app">
  <header id="toolbar">
    <div id="count-line"><span id="count">טוען עמדות...</span></div>
    <div id="filters">
      <input id="search" type="text" placeholder="חיפוש לפי שם או עיר..." autocomplete="off" />
      <div id="select-row">
        <select id="speed-filter">
          <option value="ALL">כל המהירויות</option>
          <option value="SLOW">🐢 רגילה (עד 22kW)</option>
          <option value="FAST">⚡ מהירה (50–150kW)</option>
          <option value="ULTRA">🚀 אולטרה (150kW+)</option>
        </select>
        <select id="provider-filter">
          <option value="ALL">כל המפעילים</option>
        </select>
        <button id="list-toggle" type="button">📋 רשימה</button>
      </div>
    </div>
  </header>

  <div id="map"></div>

  <div id="list-panel" class="hidden">
    <div id="list-panel-header">
      <span>עמדות קרובות</span>
      <button id="list-close" type="button">✕</button>
    </div>
    <div id="list-items"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="app.js"></script>
</body>
</html>
